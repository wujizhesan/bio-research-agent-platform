services:
  db:
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: bioagent_recovery
      POSTGRES_USER: bioagent
      POSTGRES_PASSWORD: recovery-only-password
    ports:
      - "${RECOVERY_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioagent -d bioagent_recovery"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - recovery_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    ports:
      - "${RECOVERY_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: ghcr.io/chrislusf/seaweedfs:4.38@sha256:e1ee85a3089d96c4f3df699a0944468557813f5df306819c9d368c4039070ddf
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: recovery-access-key
      AWS_SECRET_ACCESS_KEY: recovery-secret-key
    ports:
      - "${RECOVERY_S3_PORT:-19000}:8333"
    healthcheck:
      test: ["CMD", "curl", "--silent", "--output", "/dev/null", "--max-time", "2", "http://127.0.0.1:8333/"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - recovery_object_data:/data

volumes:
  recovery_pgdata:
  recovery_object_data:
