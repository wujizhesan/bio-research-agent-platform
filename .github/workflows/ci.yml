name: CI

on:
  push:
    branches: [main, platform-main]
  pull_request:
    branches: [main, platform-main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      CADD_SKIP_ASSETS: '1'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install source and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          python -m pip install pytest pytest-asyncio coverage
      - name: Run unit tests
        run: |
          coverage run --source=src -m pytest -q --ignore=tests/integration
          coverage report --fail-under=65
      - name: Verify domain catalog and workflow dry-run
        run: |
          mkdir -p output
          python -m src.domain_registry --domain all > output/ci_domains.json
          python -m src.workflow_runner --workflow examples/workflows/bgi_research_demo.yaml --dry-run --out output/ci_workflow.json
      - name: Evaluate deterministic research planning
        run: python -m src.research_evaluator --out output/ci_research_eval.json
      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          PLUGIN_SANDBOX_TOKEN=ci-plugin-sandbox-token-0000000000000000 \
            docker compose -f docker-compose.yml -f docker-compose.secure.yml config --quiet

  services:
    name: PostgreSQL, Redis and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bioagent_ci
          POSTGRES_USER: bioagent
          POSTGRES_PASSWORD: bioagent-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bioagent -d bioagent_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CADD_SKIP_ASSETS: '1'
      AUTO_CREATE_SCHEMA: 'false'
      RUN_EXTERNAL_SERVICE_TESTS: '1'
      DATABASE_URL: postgresql+asyncpg://bioagent:bioagent-ci-password@127.0.0.1:5432/bioagent_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_NAMESPACE: bioagent-fullstack-${{ github.run_id }}
      CI_LEGACY_JOB_ID: ci-legacy-before-run-context
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          python -m pip install pytest pytest-asyncio
      - name: Upgrade previous database revision
        run: |
          python -m alembic upgrade 0005_job_observability
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def seed():
              connection = await asyncpg.connect(
                  os.environ['DATABASE_URL'].replace('postgresql+asyncpg://', 'postgresql://')
              )
              try:
                  await connection.execute(
                      '''
                      INSERT INTO job_records (
                          job_id, tool, status, created_at, arguments, attempts,
                          cancel_requested, resources, priority, trace_id
                      ) VALUES ($1, $2, $3, $4, $5::json, $6, $7, $8::json, $9, $10)
                      ''',
                      os.environ['CI_LEGACY_JOB_ID'],
                      'research_catalog',
                      'completed',
                      '2026-09-07T00:00:00+00:00',
                      '{}',
                      1,
                      False,
                      '{}',
                      0,
                      'ci-legacy-trace',
                  )
              finally:
                  await connection.close()

          asyncio.run(seed())
          PY
          python -m alembic upgrade head
          python -m alembic current --check-heads
          python -m alembic check
      - name: Test real PostgreSQL and Redis
        run: python -m pytest tests/integration/test_external_services.py -q
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start authenticated API and Redis worker
        env:
          APP_ENV: production
          CADD_API_TOKEN: ''
          CADD_JWT_SECRET: ci-fullstack-jwt-secret-at-least-32-characters
          CORS_ORIGINS: http://127.0.0.1:4173
          JOB_BACKEND: redis
          JOB_EXECUTION_MODE: process
          WORKER_METRICS_PORT: '0'
        run: |
          mkdir -p output
          python - <<'PY' >> "$GITHUB_ENV"
          import time
          import jwt

          now = int(time.time())
          token = jwt.encode({
              'sub': 'ci-fullstack',
              'roles': ['admin'],
              'iat': now,
              'exp': now + 1800,
              'iss': 'bio-research-agent',
          }, 'ci-fullstack-jwt-secret-at-least-32-characters', algorithm='HS256')
          print(f'VITE_API_TOKEN={token}')
          print(f'FULLSTACK_API_TOKEN={token}')
          PY
          nohup python -m uvicorn src.fastapi_app:app --host 127.0.0.1 --port 8000 > output/ci-fullstack-api.log 2>&1 &
          echo $! > output/ci-fullstack-api.pid
          nohup python -m src.worker > output/ci-fullstack-worker.log 2>&1 &
          echo $! > output/ci-fullstack-worker.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > output/ci-fullstack-health.json; then
              exit 0
            fi
            sleep 1
          done
          cat output/ci-fullstack-api.log
          cat output/ci-fullstack-worker.log
          exit 1
      - name: Run real full-stack smoke test
        working-directory: frontend
        run: npm run test:e2e:fullstack
      - name: Upload full-stack smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fullstack-smoke-diagnostics
          retention-days: 14
          path: |
            output/ci-fullstack-*.log
            output/ci-fullstack-health.json
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  package:
    name: Build and install Python package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv .venv-package
          .venv-package/bin/python -m pip install --upgrade pip
          .venv-package/bin/python -m pip install dist/*.whl
          .venv-package/bin/python -m pip check
      - name: Smoke-test installed modules and entry points
        run: |
          mkdir -p /tmp/bio-agent-package-smoke
          cd /tmp/bio-agent-package-smoke
          "$GITHUB_WORKSPACE/.venv-package/bin/python" - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import database
          import domain_registry
          import fastapi_app
          import omics_protocol
          import redis_job_manager
          import redis_job_worker
          import research_domain_workflows
          import research_omics_workflow
          import research_protocol
          import research_workflow_builder
          import run_context
          import tool_contracts

          assert version('bio-research-agent-platform')
          assert 'site-packages' in Path(run_context.__file__).as_posix()
          assert domain_registry.active_tool_specs()
          assert fastapi_app.app is not None
          assert database.Database is not None
          assert redis_job_manager.RedisJobManager is not None
          assert redis_job_worker.RedisJobWorkerRuntime is not None
          assert omics_protocol.build_omics_tools is not None
          assert research_protocol.build_research_tools is not None
          assert research_workflow_builder._build_workflow is not None
          assert tool_contracts.bind_tool_contracts is not None
          PY
          "$GITHUB_WORKSPACE/.venv-package/bin/bio-agent-domains" --domain all > installed_domains.json
          "$GITHUB_WORKSPACE/.venv-package/bin/bio-agent-workflow" \
            --workflow "$GITHUB_WORKSPACE/examples/workflows/bgi_research_demo.yaml" \
            --dry-run \
            --out installed_workflow.json
          test -s installed_domains.json
          test -s installed_workflow.json

  container:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Build image
        run: docker build --tag bio-research-agent:ci .

  frontend:
    name: Build React workbench
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Test frontend with coverage thresholds
        working-directory: frontend
        run: npm run test:coverage
      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: error
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Enforce frontend performance budget
        working-directory: frontend
        run: npm run budget:check
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend smoke and accessibility tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-playwright-report
          retention-days: 14
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
