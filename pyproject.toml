[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-research-agent-platform"
version = "0.1.0"
description = "Pluggable research Agent platform for CADD, RNA-seq, mRNA design, literature and knowledge workflows"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "rdkit>=2024.3.5",
  "meeko>=0.7.1",
  "scikit-learn>=1.4",
  "pandas>=2.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "requests>=2.31",
  "biopython>=1.82",
  "gemmi>=0.7",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "packaging>=24.0",
  "fastapi>=0.115",
  "PyJWT>=2.8",
  "redis>=5.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "prometheus-client>=0.20",
  "boto3>=1.34",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40", "mcp>=1.28"]
chainlit = ["chainlit==2.12.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "coverage>=7", "httpx>=0.27", "build>=1.2", "twine>=5", "pip-licenses==5.5.5"]

[tool.pip-licenses]
from = "mixed"
format = "json"
with-urls = true
ignore-packages = ["bio-research-agent-platform"]
allow-only = """
3-Clause BSD License;
Apache License 2.0;
Apache Software License;
Apache-2.0;
Apache-2.0 AND BSD-2-Clause;
Apache-2.0 AND MIT;
Apache-2.0 OR BSD-2-Clause;
Apache-2.0 OR BSD-3-Clause;
BSD;
BSD License;
BSD-2-Clause;
BSD-3-Clause;
BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0;
GNU Lesser General Public License v2 or later (LGPLv2+);
LicenseRef-Biopython-License-Agreement;
MIT;
MIT AND PSF-2.0;
MIT License;
MIT-0;
MIT-CMU;
MPL-2.0;
Mozilla Public License 2.0 (MPL 2.0);
PSF-2.0;
Public Domain;
Python Software Foundation License
"""

[project.scripts]
bio-agent-domains = "domain_registry:main"
bio-agent-workflow = "workflow_runner:main"
bio-agent-reproduce = "reproducibility:main"
bio-agent-mcp = "mcp_server:main"
bio-agent-api = "fastapi_app:main"
bio-agent-eval = "research_evaluator:main"

[tool.setuptools]
package-dir = {"" = "src"}
