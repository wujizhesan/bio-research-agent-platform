services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bioagent}
      POSTGRES_USER: ${POSTGRES_USER:-bioagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bioagent-dev-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - bioagent_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bioagent}:${POSTGRES_PASSWORD:-bioagent-dev-password}@db:5432/${POSTGRES_DB:-bioagent}
      CADD_API_TOKEN: ${CADD_API_TOKEN:-change-me-in-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      UPLOAD_ROOT: ${UPLOAD_ROOT:-/app/output/uploads}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-52428800}
      AUTO_CREATE_SCHEMA: "false"
    ports:
      - "${API_PUBLISHED_PORT:-8000}:8000"
    volumes:
      - ./output:/app/output

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_PUBLISHED_PORT:-5173}:80"

volumes:
  bioagent_pgdata:
