map $http_x_forwarded_proto $bioagent_forwarded_proto {
  default $scheme;
  https https;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_header_timeout 15s;
  client_body_timeout 30s;
  client_max_body_size 2m;
  keepalive_timeout 30s;
  send_timeout 60s;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://molstar.org; font-src 'self' data:; connect-src 'self'; frame-src blob: https://molstar.org; worker-src 'self' blob:; frame-ancestors 'none'; form-action 'self'" always;
  add_header Strict-Transport-Security "max-age=86400" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /api/v1/auth/token {
    client_max_body_size 16k;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $bioagent_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location = /api/v1/files {
    client_max_body_size 55m;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $bioagent_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 60s;
    proxy_buffering off;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $bioagent_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 60s;
    proxy_buffering off;
  }

  location = /health {
    proxy_pass http://api:8000/health;
    proxy_set_header Host $host;
  }

  location = /metrics {
    return 404;
  }
}
