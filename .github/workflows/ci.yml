name: CI

on:
  push:
    branches: [main, platform-main]
  pull_request:
    branches: [main, platform-main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: '0.11.30'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      CADD_SKIP_ASSETS: '1'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install source and test dependencies
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --locked --all-extras
      - name: Enforce expand-contract migrations
        run: uv run python scripts/check_expand_contract_migrations.py
      - name: Validate typed deployment settings
        run: uv run python scripts/check_settings_consistency.py
      - name: Run unit tests
        run: |
          uv run coverage run --source=src -m pytest -q --ignore=tests/integration
          uv run coverage report --fail-under=65
      - name: Verify domain catalog and workflow dry-run
        run: |
          mkdir -p output
          uv run python -m src.domain_registry --domain all > output/ci_domains.json
          uv run python -m src.workflow_runner --workflow examples/workflows/bgi_research_demo.yaml --dry-run --out output/ci_workflow.json
      - name: Evaluate deterministic research planning
        run: uv run python -m src.research_evaluator --out output/ci_research_eval.json
      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          secret_file=$(mktemp)
          metrics_file=$(mktemp)
          webhook_file=$(mktemp)
          trap 'rm -f "$secret_file" "$metrics_file" "$webhook_file"' EXIT
          printf '%s' 'ci-plugin-sandbox-token-0000000000000000' > "$secret_file"
          printf '%s' 'ci-metrics-scrape-token-0000000000000000' > "$metrics_file"
          printf '%s' 'https://alerts.example.invalid/bioagent' > "$webhook_file"
          PLUGIN_SANDBOX_TOKEN_FILE="$secret_file" docker compose -f docker-compose.yml -f docker-compose.secure.yml config --quiet
          METRICS_SCRAPE_TOKEN_SECRET_FILE="$metrics_file" ALERTMANAGER_WEBHOOK_URL_SECRET_FILE="$webhook_file" docker compose --profile monitoring config --quiet
      - name: Validate monitoring configuration and alert behavior
        run: |
          metrics_file=$(mktemp)
          webhook_file=$(mktemp)
          trap 'rm -f "$metrics_file" "$webhook_file"' EXIT
          printf '%s' 'ci-metrics-scrape-token-0000000000000000' > "$metrics_file"
          printf '%s' 'https://alerts.example.invalid/bioagent' > "$webhook_file"
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/monitoring:/etc/prometheus:ro" \
            -v "$metrics_file:/run/secrets/metrics_scrape_token:ro" \
            prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/monitoring:/etc/prometheus:ro" \
            prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0 \
            test rules /etc/prometheus/storage-deletion-alerts.test.yml
          docker run --rm --entrypoint /bin/amtool \
            -v "$PWD/monitoring:/etc/alertmanager:ro" \
            -v "$webhook_file:/run/secrets/alertmanager_webhook_url:ro" \
            prom/alertmanager@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a \
            check-config /etc/alertmanager/alertmanager.yml

  services:
    name: PostgreSQL, Redis and migrations
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: bioagent_ci
          POSTGRES_USER: bioagent
          POSTGRES_PASSWORD: bioagent-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bioagent -d bioagent_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CADD_SKIP_ASSETS: '1'
      AUTO_CREATE_SCHEMA: 'false'
      RUN_EXTERNAL_SERVICE_TESTS: '1'
      DATABASE_URL: postgresql+asyncpg://bioagent:bioagent-ci-password@127.0.0.1:5432/bioagent_ci
      API_DATABASE_URL: postgresql+asyncpg://bioagent_api_ci:bioagent-api-ci-password@127.0.0.1:5432/bioagent_ci
      DISPATCHER_DATABASE_URL: postgresql+asyncpg://bioagent_dispatcher_ci:bioagent-dispatcher-ci-password@127.0.0.1:5432/bioagent_ci
      WORKER_DATABASE_URL: postgresql+asyncpg://bioagent_worker_ci:bioagent-worker-ci-password@127.0.0.1:5432/bioagent_ci
      MAINTENANCE_DATABASE_URL: postgresql+asyncpg://bioagent_maintenance_ci:bioagent-maintenance-ci-password@127.0.0.1:5432/bioagent_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_NAMESPACE: bioagent-fullstack-${{ github.run_id }}
      CI_LEGACY_JOB_ID: ci-legacy-before-run-context
      RLS_CONTEXT_SIGNING_KEY: ci-rls-context-signing-key-at-least-32-characters
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install integration dependencies
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --locked --all-extras
          uv pip install tests/fixtures/reliability_plugin --no-deps
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Upgrade previous database revision
        run: |
          uv run --no-sync python -m alembic upgrade 0005_job_observability
          uv run --no-sync python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def seed():
              connection = await asyncpg.connect(
                  os.environ['DATABASE_URL'].replace('postgresql+asyncpg://', 'postgresql://')
              )
              try:
                  await connection.execute('''
                  DO $roles$
                  BEGIN
                      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'bioagent_api') THEN
                          CREATE ROLE bioagent_api NOLOGIN;
                      END IF;
                      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'bioagent_worker') THEN
                          CREATE ROLE bioagent_worker NOLOGIN;
                      END IF;
                      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'bioagent_dispatcher') THEN
                          CREATE ROLE bioagent_dispatcher NOLOGIN;
                      END IF;
                      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'bioagent_maintenance') THEN
                          CREATE ROLE bioagent_maintenance NOLOGIN;
                      END IF;
                      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'bioagent_api_ci') THEN
                          CREATE ROLE bioagent_api_ci LOGIN PASSWORD 'bioagent-api-ci-password';
                      END IF;
                      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'bioagent_worker_ci') THEN
                          CREATE ROLE bioagent_worker_ci LOGIN PASSWORD 'bioagent-worker-ci-password';
                      END IF;
                      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'bioagent_dispatcher_ci') THEN
                          CREATE ROLE bioagent_dispatcher_ci LOGIN PASSWORD 'bioagent-dispatcher-ci-password';
                      END IF;
                      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'bioagent_maintenance_ci') THEN
                          CREATE ROLE bioagent_maintenance_ci LOGIN PASSWORD 'bioagent-maintenance-ci-password';
                      END IF;
                      GRANT bioagent_api TO bioagent_api_ci;
                      GRANT bioagent_dispatcher TO bioagent_dispatcher_ci;
                      GRANT bioagent_worker TO bioagent_worker_ci;
                      GRANT bioagent_maintenance TO bioagent_maintenance_ci;
                  END
                  $roles$;
                  ''')
                  await connection.execute(
                      '''
                      INSERT INTO job_records (
                          job_id, tool, status, created_at, arguments, attempts,
                          cancel_requested, resources, priority, trace_id
                      ) VALUES ($1, $2, $3, $4, $5::json, $6, $7, $8::json, $9, $10)
                      ''',
                      os.environ['CI_LEGACY_JOB_ID'],
                      'research_catalog',
                      'completed',
                      '2026-09-07T00:00:00+00:00',
                      '{}',
                      1,
                      False,
                      '{}',
                      0,
                      'ci-legacy-trace',
                  )
              finally:
                  await connection.close()

          asyncio.run(seed())
          PY
          uv run --no-sync python -m alembic upgrade head
          uv run --no-sync python -m alembic current --check-heads
          uv run --no-sync python -m alembic check
          uv run --no-sync python scripts/verify_database_roles.py
          uv run --no-sync python scripts/configure_tenant_context.py --enable
      - name: Test real PostgreSQL and Redis
        run: uv run --no-sync python -m pytest tests/integration/test_external_services.py -q
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start authenticated API and Redis worker
        env:
          APP_ENV: ci
          CADD_API_TOKEN: ''
          CADD_JWT_SECRET: ci-fullstack-jwt-secret-at-least-32-characters
          RLS_CONTEXT_SIGNING_KEY: ci-rls-context-signing-key-at-least-32-characters
          CORS_ORIGINS: http://127.0.0.1:4173
          JOB_BACKEND: redis
          JOB_EXECUTION_MODE: process
          JOB_LEASE_SECONDS: '2'
          WORKER_METRICS_PORT: '0'
        run: |
          mkdir -p output
          uv run --no-sync python - <<'PY' >> "$GITHUB_ENV"
          import asyncio
          import os
          from src.auth import AuthService, Principal, roles_sha256
          from src.database import Database

          async def issue():
              principal = Principal('ci-fullstack', ('admin',), 'jwt')
              database = Database(os.environ['API_DATABASE_URL'])
              try:
                  session = await database.create_auth_session(
                      principal.subject,
                      roles_sha256(principal.roles),
                      1800,
                  )
              finally:
                  await database.close()
              auth = AuthService(
                  jwt_secret='ci-fullstack-jwt-secret-at-least-32-characters'
              )
              token = auth.issue_token_for_principal(
                  principal,
                  session,
              )['access_token']
              print(f'FULLSTACK_API_TOKEN={token}')

          asyncio.run(issue())
          PY
          nohup env DATABASE_URL="$API_DATABASE_URL" DATABASE_ROLE=api python -m uvicorn src.fastapi_app:app --host 127.0.0.1 --port 8000 > output/ci-fullstack-api.log 2>&1 &
          echo $! > output/ci-fullstack-api.pid
          nohup env DATABASE_URL="$DISPATCHER_DATABASE_URL" DATABASE_ROLE=dispatcher python -m src.dispatcher > output/ci-fullstack-dispatcher.log 2>&1 &
          echo $! > output/ci-fullstack-dispatcher.pid
          nohup env DATABASE_URL="$WORKER_DATABASE_URL" DATABASE_ROLE=worker python -m src.worker > output/ci-fullstack-worker.log 2>&1 &
          echo $! > output/ci-fullstack-worker.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > output/ci-fullstack-health.json; then
              exit 0
            fi
            sleep 1
          done
          cat output/ci-fullstack-api.log
          cat output/ci-fullstack-dispatcher.log
          cat output/ci-fullstack-worker.log
          exit 1
      - name: Run real full-stack smoke test
        working-directory: frontend
        run: npm run test:e2e:fullstack
      - name: Upload full-stack smoke diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fullstack-smoke-diagnostics
          retention-days: 14
          path: |
            output/ci-fullstack-*.log
            output/ci-fullstack-health.json
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  secure-plugin-e2e:
    name: Secure full-stack container execution
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: bioagent-security-${{ github.run_id }}
      PLUGIN_SANDBOX_TOKEN_FILE: /tmp/bioagent-plugin-sandbox-token-${{ github.run_id }}
      METRICS_SCRAPE_TOKEN_SECRET_FILE: /tmp/bioagent-metrics-scrape-token-${{ github.run_id }}
      ALERTMANAGER_WEBHOOK_URL_SECRET_FILE: /tmp/bioagent-alertmanager-webhook-url-${{ github.run_id }}
      MONITORING_SECRET_GID: '4242'
      APP_ENV: ci
      API_PUBLISHED_PORT: '18080'
      WORKER_METRICS_PUBLISHED_PORT: '19000'
      POSTGRES_PASSWORD: ci-secure-stack-postgres-password
      API_DATABASE_URL: postgresql+asyncpg://bioagent_api_secure:ci-api-password@db:5432/bioagent
      API_DATABASE_ROLE: api
      DISPATCHER_DATABASE_URL: postgresql+asyncpg://bioagent_dispatcher_secure:ci-dispatcher-password@db:5432/bioagent
      DISPATCHER_DATABASE_ROLE: dispatcher
      WORKER_DATABASE_URL: postgresql+asyncpg://bioagent_worker_secure:ci-worker-password@db:5432/bioagent
      WORKER_DATABASE_ROLE: worker
      MAINTENANCE_DATABASE_URL: postgresql+asyncpg://bioagent_maintenance_secure:ci-maintenance-password@db:5432/bioagent
      MAINTENANCE_DATABASE_ROLE: maintenance
      CADD_JWT_SECRET: ci-secure-stack-jwt-secret-at-least-32-characters
      RLS_CONTEXT_SIGNING_KEY: ci-secure-stack-rls-context-key-at-least-32-characters
      CADD_AUTH_USERS_JSON: '{"secure-e2e":{"password":"ci-secure-e2e-password","roles":["admin"]}}'
      SECURE_E2E_USERNAME: secure-e2e
      SECURE_E2E_PASSWORD: ci-secure-e2e-password
      REDIS_NAMESPACE: bioagent-secure-${{ github.run_id }}
      WORKER_MIN_FREE_DISK_BYTES: '1048576'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare sandbox credential
        run: |
          umask 077
          printf '%s' 'ci-plugin-sandbox-token-0000000000000000' > "$PLUGIN_SANDBOX_TOKEN_FILE"
          sudo chown 1000:1000 "$PLUGIN_SANDBOX_TOKEN_FILE"
          sudo chmod 0400 "$PLUGIN_SANDBOX_TOKEN_FILE"
          printf '%s' 'ci-metrics-scrape-token-0000000000000000' > "$METRICS_SCRAPE_TOKEN_SECRET_FILE"
          printf '%s' 'http://alert-webhook-sink:8082/alerts' > "$ALERTMANAGER_WEBHOOK_URL_SECRET_FILE"
          sudo chown "$(id -u):$MONITORING_SECRET_GID" \
            "$METRICS_SCRAPE_TOKEN_SECRET_FILE" "$ALERTMANAGER_WEBHOOK_URL_SECRET_FILE"
          sudo chmod 0440 \
            "$METRICS_SCRAPE_TOKEN_SECRET_FILE" "$ALERTMANAGER_WEBHOOK_URL_SECRET_FILE"
          mkdir -p output
          chmod 0777 output
      - name: Build secure full stack
        run: |
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.yml -f docker-compose.secure.yml \
              build api migration dispatcher worker plugin-sandbox plugin-sandbox-heavy; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Migrate database and start secure stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.secure.yml up -d --wait db redis
          docker compose -f docker-compose.yml -f docker-compose.secure.yml exec -T db psql -v ON_ERROR_STOP=1 -U bioagent -d bioagent <<'SQL'
          DO $roles$
          BEGIN
            CREATE ROLE bioagent_api NOLOGIN;
            CREATE ROLE bioagent_dispatcher NOLOGIN;
            CREATE ROLE bioagent_worker NOLOGIN;
            CREATE ROLE bioagent_maintenance NOLOGIN;
            CREATE ROLE bioagent_api_secure LOGIN PASSWORD 'ci-api-password';
            CREATE ROLE bioagent_dispatcher_secure LOGIN PASSWORD 'ci-dispatcher-password';
            CREATE ROLE bioagent_worker_secure LOGIN PASSWORD 'ci-worker-password';
            CREATE ROLE bioagent_maintenance_secure LOGIN PASSWORD 'ci-maintenance-password';
            GRANT bioagent_api TO bioagent_api_secure;
            GRANT bioagent_dispatcher TO bioagent_dispatcher_secure;
            GRANT bioagent_worker TO bioagent_worker_secure;
            GRANT bioagent_maintenance TO bioagent_maintenance_secure;
          END
          $roles$;
          SQL
          docker compose -f docker-compose.yml -f docker-compose.secure.yml --profile operations run --rm migration
          docker compose -f docker-compose.yml -f docker-compose.secure.yml --profile operations run --rm --no-deps migration python scripts/configure_tenant_context.py --enable
          docker compose -f docker-compose.yml -f docker-compose.secure.yml --profile operations run --rm --no-deps migration python scripts/verify_database_roles.py
          docker compose -f docker-compose.yml -f docker-compose.secure.yml up -d api dispatcher worker plugin-sandbox plugin-sandbox-heavy
          for attempt in {1..180}; do
            plugin_id=$(docker compose -f docker-compose.yml -f docker-compose.secure.yml ps -q plugin-sandbox)
            heavy_plugin_id=$(docker compose -f docker-compose.yml -f docker-compose.secure.yml ps -q plugin-sandbox-heavy)
            worker_id=$(docker compose -f docker-compose.yml -f docker-compose.secure.yml ps -q worker)
            dispatcher_id=$(docker compose -f docker-compose.yml -f docker-compose.secure.yml ps -q dispatcher)
            plugin_status=$(docker inspect --format='{{.State.Health.Status}}' "$plugin_id" 2>/dev/null || true)
            heavy_plugin_status=$(docker inspect --format='{{.State.Health.Status}}' "$heavy_plugin_id" 2>/dev/null || true)
            worker_status=$(docker inspect --format='{{.State.Health.Status}}' "$worker_id" 2>/dev/null || true)
            dispatcher_status=$(docker inspect --format='{{.State.Health.Status}}' "$dispatcher_id" 2>/dev/null || true)
            if curl --fail --silent http://127.0.0.1:18080/health > output/ci-secure-fullstack-health.json \
              && [ "$plugin_status" = healthy ] \
              && [ "$heavy_plugin_status" = healthy ] \
              && [ "$worker_status" = healthy ] \
              && [ "$dispatcher_status" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.secure.yml logs api dispatcher worker plugin-sandbox plugin-sandbox-heavy clamav db redis
          exit 1
      - name: Run API to sandbox artifact round trip
        run: python scripts/verify_secure_fullstack_e2e.py --base-url http://127.0.0.1:18080
      - name: Capture secure job latency baseline
        run: |
          python -m scripts.benchmark_secure_jobs \
            --base-url http://127.0.0.1:18080 \
            --index-path /app/output/secure-fullstack-e2e/artifacts/knowledge-index.json \
            --samples 10 \
            --output output/performance-baseline.json
      - name: Capture multi-domain concurrent workload matrix
        run: |
          python -m scripts.benchmark_workload_matrix \
            --base-url http://127.0.0.1:18080 \
            --index-path /app/output/secure-fullstack-e2e/artifacts/knowledge-index.json \
            --samples 8 \
            --concurrency 1,2,8 \
            --output output/performance-matrix.json
      - name: Compare secure sandbox capacity at concurrency 2, 3, and 4
        run: |
          python -m scripts.benchmark_sandbox_capacity \
            --base-url http://127.0.0.1:18080 \
            --index-path /app/output/secure-fullstack-e2e/artifacts/knowledge-index.json \
            --samples 24 \
            --load-concurrency 8 \
            --output output/sandbox-capacity.json
      - name: Verify heavy and lightweight jobs in the secure sandbox
        run: |
          compose() {
            docker compose -f docker-compose.yml -f docker-compose.secure.yml "$@"
          }
          restore_worker() {
            export SECURE_WORKER_LIGHT_RESERVED_SLOTS=3
            compose up -d --no-deps --force-recreate --wait worker
          }
          trap restore_worker EXIT
          light_before=$(docker compose -f docker-compose.yml -f docker-compose.secure.yml exec -T plugin-sandbox python -c "import json,urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:8081/health'))['admitted'])")
          heavy_before=$(docker compose -f docker-compose.yml -f docker-compose.secure.yml exec -T plugin-sandbox-heavy python -c "import json,urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:8081/health'))['admitted'])")
          export SECURE_WORKER_LIGHT_RESERVED_SLOTS=0
          compose up -d --no-deps --force-recreate --wait worker
          python -m scripts.verify_secure_mixed_resources \
            --base-url http://127.0.0.1:18080 \
            --artifact-prefix reservation-off \
            --heavy-running-target 3 \
            > output/heavy-light-isolation-baseline.json
          export SECURE_WORKER_LIGHT_RESERVED_SLOTS=3
          compose up -d --no-deps --force-recreate --wait worker
          python -m scripts.verify_secure_mixed_resources \
            --base-url http://127.0.0.1:18080 \
            --artifact-prefix reservation-on \
            --heavy-running-target 1 \
            > output/heavy-light-isolation.json
          python - <<'PY'
          import json
          from pathlib import Path

          baseline = json.loads(Path('output/heavy-light-isolation-baseline.json').read_text())
          optimized = json.loads(Path('output/heavy-light-isolation.json').read_text())
          assert optimized['light_overlap_count'] == 8
          assert optimized['max_light_running_while_heavy'] >= 3
          assert optimized['light_queue_p95_seconds'] < baseline['light_queue_p95_seconds']
          print(json.dumps({
              'baseline_light_queue_p95': baseline['light_queue_p95_seconds'],
              'reserved_light_queue_p95': optimized['light_queue_p95_seconds'],
              'baseline_heavy_server_p95': baseline['heavy_server_p95_seconds'],
              'reserved_heavy_server_p95': optimized['heavy_server_p95_seconds'],
          }, sort_keys=True))
          PY
          trap - EXIT
          cat output/heavy-light-isolation.json
          light_after=$(docker compose -f docker-compose.yml -f docker-compose.secure.yml exec -T plugin-sandbox python -c "import json,urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:8081/health'))['admitted'])")
          heavy_after=$(docker compose -f docker-compose.yml -f docker-compose.secure.yml exec -T plugin-sandbox-heavy python -c "import json,urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:8081/health'))['admitted'])")
          test "$light_after" -gt "$light_before"
          test "$heavy_after" -gt "$heavy_before"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.benchmark_sandbox_capacity import cgroup_snapshot, parse_cgroup

          report = {
              service: parse_cgroup(cgroup_snapshot(os.environ.copy(), service))
              for service in ('plugin-sandbox', 'plugin-sandbox-heavy')
          }
          assert all(not pool['memory_events'].get('oom_kill', 0) for pool in report.values())
          Path('output/heavy-light-resources.json').write_text(
              json.dumps(report, indent=2, sort_keys=True), encoding='utf-8'
          )
          print(json.dumps({name: data['memory_peak'] for name, data in report.items()}))
          PY
      - name: Compare Worker slot reservations over three mixed-load rounds
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m scripts.benchmark_worker_slots \
            --base-url http://127.0.0.1:18080 \
            --worker-metrics-url http://127.0.0.1:19000/metrics \
            --rounds 3 \
            --output output/worker-slot-benchmark.json
      - name: Verify sandbox mounts and cleanup
        run: |
          mkdir -p output
          container_id=$(docker compose -f docker-compose.yml -f docker-compose.secure.yml ps -q plugin-sandbox)
          docker inspect "$container_id" > output/ci-plugin-sandbox-inspect.json
          heavy_container_id=$(docker compose -f docker-compose.yml -f docker-compose.secure.yml ps -q plugin-sandbox-heavy)
          docker inspect "$heavy_container_id" > output/ci-plugin-sandbox-heavy-inspect.json
          python - <<'PY'
          import json
          from pathlib import Path

          for name in ('ci-plugin-sandbox-inspect.json', 'ci-plugin-sandbox-heavy-inspect.json'):
              inspection = json.loads(Path('output', name).read_text(encoding='utf-8'))[0]
              destinations = {item['Destination'] for item in inspection['Mounts']}
              assert '/app/output' not in destinations
              assert '/run/bioagent/plugin-exchange' in destinations
          PY
          if docker compose -f docker-compose.yml -f docker-compose.secure.yml exec -T plugin-sandbox touch /app/output/.boundary-probe 2>/dev/null; then
            docker compose -f docker-compose.yml -f docker-compose.secure.yml exec -T plugin-sandbox rm -f /app/output/.boundary-probe
            exit 1
          fi
          leftovers=$(docker compose -f docker-compose.yml -f docker-compose.secure.yml exec -T plugin-sandbox find /run/bioagent/plugin-exchange -mindepth 1 -maxdepth 1 -print -quit)
          test -z "$leftovers"
      - name: Start and verify production monitoring path
        run: |
          mkdir -p output/monitoring-smoke
          chmod 0777 output/monitoring-smoke
          rm -f output/monitoring-smoke/alerts.jsonl output/monitoring-smoke/prometheus-targets.json
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.secure.yml \
            -f docker-compose.monitoring-test.yml \
            --profile monitoring \
            up -d --wait api worker alert-webhook-sink prometheus alertmanager
          python scripts/verify_monitoring_stack.py \
            --delivery-file output/monitoring-smoke/alerts.jsonl \
            --evidence-directory output/monitoring-smoke \
            --timeout-seconds 75
      - name: Capture secure full-stack diagnostics
        if: always()
        run: |
          mkdir -p output
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.secure.yml \
            -f docker-compose.monitoring-test.yml \
            --profile monitoring \
            logs --no-color --timestamps \
            api dispatcher worker plugin-sandbox plugin-sandbox-heavy clamav db redis \
            prometheus alertmanager alert-webhook-sink \
            > output/ci-secure-fullstack.log 2>&1 || true
      - name: Upload secure full-stack diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: secure-fullstack-diagnostics
          retention-days: 14
          path: |
            output/ci-secure-fullstack.log
            output/ci-secure-fullstack-health.json
            output/ci-plugin-sandbox-inspect.json
            output/ci-plugin-sandbox-heavy-inspect.json
            output/performance-baseline.json
            output/performance-matrix.json
            output/sandbox-capacity*.json
            output/heavy-light-isolation.json
            output/heavy-light-isolation-baseline.json
            output/heavy-light-resources.json
            output/worker-slot-benchmark.json
            output/secure-fullstack-e2e
            output/monitoring-smoke
          if-no-files-found: ignore
      - name: Clean up secure plugin stack
        if: always()
        run: |
          if [ -f "$PLUGIN_SANDBOX_TOKEN_FILE" ]; then
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.secure.yml \
              -f docker-compose.monitoring-test.yml \
              --profile monitoring \
              down -v --remove-orphans
          fi
          sudo rm -f \
            "$PLUGIN_SANDBOX_TOKEN_FILE" \
            "$METRICS_SCRAPE_TOKEN_SECRET_FILE" \
            "$ALERTMANAGER_WEBHOOK_URL_SECRET_FILE"

  package:
    name: Build and install Python package
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Build and validate distributions
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --locked --all-extras
          uv run python -m build
          uv run python -m twine check dist/*
      - name: Install wheel in a clean environment
        run: |
          uv venv .venv-package
          uv pip install --python .venv-package/bin/python dist/*.whl
          uv pip check --python .venv-package/bin/python
      - name: Smoke-test installed modules and entry points
        run: |
          mkdir -p /tmp/bio-agent-package-smoke
          cd /tmp/bio-agent-package-smoke
          "$GITHUB_WORKSPACE/.venv-package/bin/python" - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import database
          import domain_registry
          import execution_semantics
          import fastapi_app
          import omics_protocol
          import redis_job_manager
          import redis_job_worker
          import research_domain_workflows
          import research_omics_workflow
          import research_protocol
          import research_workflow_builder
          import run_context
          import storage_workspace
          import tool_contracts

          assert version('bio-research-agent-platform')
          assert 'site-packages' in Path(run_context.__file__).as_posix()
          assert domain_registry.active_tool_specs()
          assert execution_semantics.VALID_EXECUTION_SEMANTICS
          assert fastapi_app.app is not None
          assert database.Database is not None
          assert redis_job_manager.RedisJobManager is not None
          assert redis_job_worker.RedisJobWorkerRuntime is not None
          assert omics_protocol.build_omics_tools is not None
          assert research_protocol.build_research_tools is not None
          assert research_workflow_builder._build_workflow is not None
          assert storage_workspace.materialize_storage_references is not None
          assert tool_contracts.bind_tool_contracts is not None
          PY
          "$GITHUB_WORKSPACE/.venv-package/bin/bio-agent-domains" --domain all > installed_domains.json
          "$GITHUB_WORKSPACE/.venv-package/bin/bio-agent-workflow" \
            --workflow "$GITHUB_WORKSPACE/examples/workflows/bgi_research_demo.yaml" \
            --dry-run \
            --out installed_workflow.json
          test -s installed_domains.json
          test -s installed_workflow.json

  supply-chain:
    name: Audit Python and npm dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Export and verify locked Python dependencies
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock --check
          uv export --locked --no-dev --no-hashes --no-emit-project --output-file requirements.txt
          uv export --locked --all-extras --no-dev --no-hashes --no-emit-project --output-file requirements-ui.txt
          git diff --exit-code -- requirements.txt requirements-ui.txt
          mkdir -p output
          uv export --locked --all-extras --no-emit-project --output-file output/audit-requirements.txt
      - name: Audit runtime, UI, Chainlit and development dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: output/audit-requirements.txt
          require-hashes: true
      - name: Enforce Python dependency license policy
        run: uv run pip-licenses --output-file=output/python-licenses.json
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend audit dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Verify npm registry signatures and provenance
        working-directory: frontend
        run: npm audit signatures --registry=https://registry.npmjs.org
      - name: Enforce frontend dependency license policy
        working-directory: frontend
        run: npm run licenses:check
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - name: Upload dependency license evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-license-evidence
          retention-days: 90
          path: |
            output/python-licenses.json
            frontend/output/dependency-licenses.json
          if-no-files-found: warn

  container:
    name: Scan ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image_ref: bio-research-agent:ci
            build_context: .
            dockerfile: Dockerfile
            exit_code: '1'
          - name: frontend
            image_ref: bio-research-agent-web:ci
            build_context: frontend
            dockerfile: frontend/Dockerfile
            exit_code: '1'
          - name: redis
            image_ref: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
            pull_image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
            baseline_name: redis
            exit_code: '0'
          - name: postgres
            image_ref: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
            pull_image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
            baseline_name: postgres
            exit_code: '0'
          - name: clamav
            image_ref: clamav/clamav:1.5@sha256:1fdfd24c6f0a0fb60788481487459a6d4eda8a9b448641594e04db8410d34422
            pull_image: clamav/clamav:1.5@sha256:1fdfd24c6f0a0fb60788481487459a6d4eda8a9b448641594e04db8410d34422
            baseline_name: clamav
            exit_code: '0'
          - name: prometheus
            image_ref: prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
            pull_image: prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
            baseline_name: prometheus
            exit_code: '0'
          - name: alertmanager
            image_ref: prom/alertmanager@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
            pull_image: prom/alertmanager@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
            baseline_name: alertmanager
            exit_code: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build local image
        if: matrix.build_context != ''
        run: docker build --file "${{ matrix.dockerfile }}" --tag "${{ matrix.image_ref }}" "${{ matrix.build_context }}"
      - name: Pull service image
        if: matrix.pull_image != ''
        run: docker pull "${{ matrix.pull_image }}"
      - name: Prepare SBOM output
        run: mkdir -p output/sbom output/security
      - name: Generate image CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image_ref }}
          version: v0.74.0
          format: cyclonedx
          output: output/sbom/${{ matrix.name }}.cdx.json
          scanners: vuln
          timeout: 15m
          hide-progress: true
      - name: Generate repository CycloneDX SBOM
        if: matrix.name == 'backend'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: output/sbom/repository.cdx.json
          scanners: vuln
          timeout: 15m
          hide-progress: true
          skip-setup-trivy: true
      - name: Upload software bills of materials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cyclonedx-sbom-${{ matrix.name }}
          retention-days: 30
          path: |
            output/sbom/${{ matrix.name }}.cdx.json
            output/sbom/repository.cdx.json
          if-no-files-found: error
      - name: Generate third-party vulnerability report
        if: matrix.baseline_name != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image_ref }}
          version: v0.74.0
          format: json
          output: output/security/${{ matrix.name }}.trivy.json
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          timeout: 15m
          hide-progress: true
          skip-setup-trivy: true
      - name: Enforce third-party vulnerability baseline
        if: matrix.baseline_name != ''
        run: |
          python tools/check_container_vulnerability_baseline.py \
            --image-name "${{ matrix.baseline_name }}" \
            --image-ref "${{ matrix.image_ref }}" \
            --report "output/security/${{ matrix.name }}.trivy.json" \
            --baseline security/container-vulnerability-baseline.json \
            --summary "output/security/${{ matrix.name }}.baseline-summary.json"
      - name: Upload third-party vulnerability evidence
        if: always() && matrix.baseline_name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vulnerability-evidence-${{ matrix.name }}
          retention-days: 90
          path: output/security/
          if-no-files-found: warn
      - name: Scan image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image_ref }}
          format: table
          exit-code: ${{ matrix.exit_code }}
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          timeout: 15m
          hide-progress: true
          skip-setup-trivy: true

  frontend:
    name: Build React workbench
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Test frontend with coverage thresholds
        working-directory: frontend
        run: npm run test:coverage
      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: error
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Enforce frontend performance budget
        working-directory: frontend
        run: npm run budget:check
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend smoke and accessibility tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-playwright-report
          retention-days: 14
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
