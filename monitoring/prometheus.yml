global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: bioagent-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_scrape_token
    static_configs:
      - targets:
          - api:8000

  - job_name: bioagent-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:9000

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
