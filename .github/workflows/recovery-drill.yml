name: Recovery drill

on:
  schedule:
    - cron: "37 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-drill
  cancel-in-progress: false

jobs:
  restore:
    name: Restore PostgreSQL, objects and durable job state
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        env:
          UV_VERSION: "0.11.30"
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --locked --all-extras
      - name: Validate recovery service configuration
        run: docker compose -f docker-compose.recovery.yml config --quiet
      - name: Execute destructive recovery drill against isolated services
        run: |
          uv run python scripts/recovery_drill.py \
            --project "bio-recovery-${GITHUB_RUN_ID}" \
            --output output/recovery-drill
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recovery-drill-${{ github.run_id }}
          retention-days: 30
          path: output/recovery-drill
          if-no-files-found: warn
