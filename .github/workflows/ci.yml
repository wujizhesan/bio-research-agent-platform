name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      CADD_SKIP_ASSETS: '1'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Verify database migration
        run: |
          mkdir -p output
          DATABASE_URL=sqlite+aiosqlite:///./output/ci.db alembic upgrade head
      - name: Verify domain catalog and workflow dry-run
        run: |
          python -m src.domain_registry --domain all > output/ci_domains.json
          python -m src.workflow_runner --workflow examples/workflows/bgi_research_demo.yaml --dry-run --out output/ci_workflow.json
      - name: Evaluate deterministic research planning
        run: python -m src.research_evaluator --out output/ci_research_eval.json
      - name: Validate Compose configuration
        run: docker compose config --quiet

  container:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Build image
        run: docker build --tag bio-research-agent:ci .

  frontend:
    name: Build React workbench
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
